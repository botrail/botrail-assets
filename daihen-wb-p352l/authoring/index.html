<script type="module">
import {definition} from './model.mjs';
import {THREE} from '@botrail/authoring/tool-shapes.mjs';
import {referenceScene} from '@botrail/authoring/reference-model.mjs';
import {mountAuthoring} from '@botrail/authoring/viewer.mjs';
import {frameCamera} from '@botrail/authoring/display.mjs';
const model=referenceScene(definition());
const viewer=mountAuthoring(model.root,{iso:[-1.4,-2,1]});
const bounds=new THREE.Box3().setFromObject(model.root);let active='iso';
const show=name=>{active=name;if(name==='rear'){frameCamera(viewer.camera,bounds,[-1,1.5,.6]);viewer.render();}else viewer.view(name);};
for(const button of document.querySelectorAll('button'))button.onclick=()=>show(button.id);
addEventListener('resize',()=>show(active));
