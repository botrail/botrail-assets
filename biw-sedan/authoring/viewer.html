<!doctype html>
<meta charset="utf-8" />
<title>biw-sedan — authoring viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #14171c; color: #cfd6e0;
               font: 13px/1.5 ui-monospace, monospace; }
  #hud { position: fixed; top: 10px; left: 12px; z-index: 10; white-space: pre;
         background: #0009; padding: 8px 10px; border-radius: 6px; }
  #hud b { color: #8fd0ff; }
  label { display: block; margin-top: 4px; }
</style>
<div id="hud">loading…</div>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "@botrail/authoring/": "./node_modules/@botrail/authoring/",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { createDisplayRig, DISPLAY_PROFILE, prepareVisuals, frameCamera } from "@botrail/authoring/display.mjs";
  import { buildPanels, buildPieces, buildVisualMeshes } from "./biw.mjs";

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(DISPLAY_PROFILE.fov, innerWidth / innerHeight, 0.05, 100);
  camera.position.set(4.6, -4.2, 2.6);
  camera.up.set(0, 0, 1); // Z-up, like the catalog
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const display = createDisplayRig(renderer, scene);
  document.body.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0.6);



  const panels = buildPanels();
  const pieces = buildPieces(panels);
  const { skin } = buildVisualMeshes(panels);
  const structure = skin; // single shell; [t] kept as a no-op toggle
  scene.add(skin);
  prepareVisuals(skin);
  const bounds = new THREE.Box3().setFromObject(skin);
  display.fit(bounds); controls.target.copy(frameCamera(camera, bounds)); controls.update();

  // collision compound, shown as wireframe so the openings are checkable
  const collision = new THREE.Group();
  collision.visible = false;
  for (const p of pieces) {
    collision.add(new THREE.Mesh(p.geometry,
      new THREE.MeshBasicMaterial({ color: 0xff8a3d, wireframe: true })));
  }
  scene.add(collision);

  const faces = (g) => (g.getIndex() ? g.getIndex().count : g.getAttribute("position").count) / 3;
  document.getElementById("hud").innerHTML =
    `<b>biw-sedan</b>  ${panels.length} panels / collision ${pieces.length} pieces\n` +
    `visual ${faces(skin.geometry)} faces\n\n` +
    `[s] shell  [c] collision wireframe   views: [1] side [2] front 3/4 [3] top [4] rear 3/4`;

  const VIEWS = {
    "1": [0.02, -6.4, 0.9],
    "2": [5.0, -4.4, 2.2],
    "3": [0.4, -0.3, 7.0],
    "4": [-5.0, -4.4, 2.2],
  };
  addEventListener("keydown", (e) => {
    if (VIEWS[e.key]) {
      camera.position.set(...VIEWS[e.key]);
      controls.target.set(0, 0, 0.65);
      controls.update();
    }
    if (e.key === "s") skin.visible = !skin.visible;
    if (e.key === "c") collision.visible = !collision.visible;
  });
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  window.authoredModel = { ready: true, renderer, scene, camera, profile: DISPLAY_PROFILE.id };
  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();
</script>
