<!doctype html>
<html lang="ja">
<meta charset="utf-8">

<style>

<script type="importmap">{"imports":{
  "three":"./node_modules/three/build/three.module.js",

<script type="module">
import { mountAuthoring } from "@botrail/authoring/viewer.mjs";
import { definition } from "./model.mjs";
const d = definition(), mid = d.slug === "mid-360";
