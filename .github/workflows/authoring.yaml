name: Authored models

on:
  push:
    paths:
      - 'authoring/**'
      - 'universal-robots-ur-series/**'
      - 'kuka-kr210-l150/**'
      - 'daihen-wb-p352l/**'
      - 'daihen-cm-7403/**'
      - 'fanuc-m410ic-185/**'
      - 'mir250/**'
      - 'mir1350/**'
      - 'toyota-sae160/**'
      - 'onrobot-rg6/**'
      - 'onrobot-rg2/**'
      - 'robotiq-ax-series-base/**'
      - 'piab-picobot/**'
      - 'onrobot-dual-quick-changer-109878/**'
      - 'onrobot-screwdriver-103961/**'
      - 'onrobot-bit-extender-109301/**'
      - 'ewellix-liftkit-ur620/**'
      - 'mid-360/authoring/**'
      - 'mid-360/usd/**'
      - 'vacuum-gripper-ecbpi/authoring/**'
      - 'vacuum-gripper-ecbpi/usd/**'
      - 'weld-gun-x16005/authoring/**'
      - 'weld-gun-x16005/usd/**'
      - 'x-guard-classic/**'
      - 'belgotch-type34-s1/**'
      - 'nito-fz/**'
      - 'equipment-common/**'
      - 'workshop-shapes/**'
      - '.github/workflows/authoring.yaml'
  pull_request:
    paths:
      - 'authoring/**'
      - 'universal-robots-ur-series/**'
      - 'kuka-kr210-l150/**'
      - 'daihen-wb-p352l/**'
      - 'daihen-cm-7403/**'
      - 'fanuc-m410ic-185/**'
      - 'mir250/**'
      - 'mir1350/**'
      - 'toyota-sae160/**'
      - 'onrobot-rg6/**'
      - 'onrobot-rg2/**'
      - 'robotiq-ax-series-base/**'
      - 'piab-picobot/**'
      - 'onrobot-dual-quick-changer-109878/**'
      - 'onrobot-screwdriver-103961/**'
      - 'onrobot-bit-extender-109301/**'
      - 'ewellix-liftkit-ur620/**'
      - 'mid-360/authoring/**'
      - 'mid-360/usd/**'
      - 'vacuum-gripper-ecbpi/authoring/**'
      - 'vacuum-gripper-ecbpi/usd/**'
      - 'weld-gun-x16005/authoring/**'
      - 'weld-gun-x16005/usd/**'
      - 'x-guard-classic/**'
      - 'belgotch-type34-s1/**'
      - 'nito-fz/**'
      - 'equipment-common/**'
      - 'workshop-shapes/**'
      - '.github/workflows/authoring.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        shell: bash
        run: |
          npm --prefix authoring ci --ignore-scripts --no-audit --no-fund
          for asset in mid-360 vacuum-gripper-ecbpi weld-gun-x16005 universal-robots-ur-series onrobot-rg6 ewellix-liftkit-ur620 workshop-shapes kuka-kr210-l150 mir250 mir1350 fanuc-m410ic-185 toyota-sae160; do
            (cd "$asset/authoring" && npm ci --ignore-scripts --no-audit --no-fund)
          done
      - name: Shared helpers
        run: npm --prefix authoring test
      - name: Model tests and unchanged USD
        run: npm --prefix authoring run test:models
      - name: Equipment meshes match authored sources
        run: |
          node x-guard-classic/authoring/export.mjs --check
          node nito-fz/authoring/export.mjs --check
      - name: Workshop shape layers match their authoring source
        run: |
          npm --prefix workshop-shapes/authoring test
          node workshop-shapes/authoring/export.mjs --check
      - name: Public UR+ reference geometry and motion
        run: |
          for asset in universal-robots-ur-series onrobot-rg6 ewellix-liftkit-ur620; do
            npm --prefix "$asset/authoring" test
            npm --prefix "$asset/authoring" run check
          done

      - name: OnRobot assembly tooling
        run: |
          node --test onrobot-screwdriver-103961/authoring/model.test.mjs
          for asset in onrobot-dual-quick-changer-109878 onrobot-screwdriver-103961 onrobot-bit-extender-109301; do
            node "$asset/authoring/export.mjs" --check
          done

      - name: KUKA and MiR250 public reference models
        run: |
          for asset in kuka-kr210-l150 mir250; do
            npm --prefix "$asset/authoring" test
            npm --prefix "$asset/authoring" run check
          done

      - name: DAIHEN WB-P352L reference geometry and compatibility
        run: |
          node --test daihen-wb-p352l/authoring/model.test.mjs
          node daihen-wb-p352l/authoring/export.mjs --check
          python3 daihen-wb-p352l/authoring/verify_obj.py

      - name: MiR1350 geometry and compatibility
        run: |
          npm --prefix mir1350/authoring test
          npm --prefix mir1350/authoring run check

      - name: FANUC M-410iC/185 geometry, linkage and compatibility
        run: |
          npm --prefix fanuc-m410ic-185/authoring test
          npm --prefix fanuc-m410ic-185/authoring run check
          python3 fanuc-m410ic-185/authoring/verify_obj.py

      - name: Toyota SAE160 TX and DX geometry and lift compatibility
        run: |
          npm --prefix toyota-sae160/authoring test
          npm --prefix toyota-sae160/authoring run check
          python3 toyota-sae160/authoring/verify_obj.py

      - name: DAIHEN CM-7403 geometry and legacy compatibility
        run: |
          npm --prefix daihen-cm-7403/authoring test
          npm --prefix daihen-cm-7403/authoring run check
          python3 daihen-cm-7403/authoring/verify_obj.py

      - name: OnRobot RG2 and RG6 visual topology and legacy contracts
        run: |
          node --test onrobot-rg2/authoring/model.test.mjs
          node --test authoring/test/onrobot-contract.test.mjs
          node onrobot-rg2/authoring/export.mjs --check
          python3 onrobot-rg2/authoring/verify_obj.py
          python3 onrobot-rg6/authoring/verify_obj.py

      - name: Robotiq AX legacy contract and full-stroke visual clearance
        run: |
          node --test robotiq-ax-series-base/authoring/model.test.mjs
          node robotiq-ax-series-base/authoring/export.mjs --check
          python3 robotiq-ax-series-base/authoring/verify_obj.py
          python3 robotiq-ax-series-base/authoring/verify_motion.py

      - name: Piab piCOBOT UR legacy frames and visual topology
        run: |
          node --test piab-picobot/authoring/model.test.mjs
          node piab-picobot/authoring/export.mjs --check
          python3 piab-picobot/authoring/verify_obj.py
          node piab-picobot/authoring/verify_clearance.mjs
