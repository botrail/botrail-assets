<!doctype html><html lang="en"><meta charset="utf-8"><title>AGIBOT G1 independent visual study</title>
<style>body{margin:0;font:14px system-ui;overflow:hidden}.panel{position:absolute;top:16px;left:16px;background:#fffffff0;border:1px solid #ddd;border-radius:10px;padding:16px;width:310px}h1{font-size:18px;margin:0 0 8px}p{font-size:12px;color:#46525e}button,select{padding:5px;margin:3px}label{display:block;margin:9px 0}input{width:175px}</style>
<div class="panel"><h1>AGIBOT G1 · independent study</h1><p>Photo-estimated exterior + illustrative motion<br>No OEM meshes or kinematics. Not for hardware control.</p><select id="pose"><option>travel</option><option>raised</option><option>reach</option><option>head_turn</option></select><label>Lift <input id="lift" type="range" min="0" max="0.5" step="0.001" value="0"><output id="height">1.30 m</output></label><label>Jaw gap <input id="gap" type="range" min="0" max="120" step="1" value="79"><output id="gap_value">79 mm</output></label><button id="iso">Perspective</button><button id="front">Front</button><button id="side">Side</button><button id="top">Top</button><p>0.70 m shoulder-to-TCP reach uses an assumed endpoint. Collision proxies and motion are approximate.</p></div>
<script type="importmap">{"imports":{"three":"/authoring/node_modules/three/build/three.module.js","three/addons/":"/authoring/node_modules/three/examples/jsm/","@botrail/authoring/":"/authoring/"}}</script>
<script type="module">
import {definition,poses} from './model.mjs';import {referenceScene} from '@botrail/authoring/reference-model.mjs';import {mountAuthoring} from '@botrail/authoring/viewer.mjs';
const model=referenceScene(definition());model.pose(poses.raised);const display=mountAuthoring(model.root,{iso:[4,-6,2.6]});let values={...poses.travel};const $=id=>document.getElementById(id);function render(){model.pose(values);$('lift').value=values.lift??0;$('height').textContent=(1.3+(values.lift??0)).toFixed(2)+' m';const gap=140*Math.sin(values.left_gripper_open??0);$('gap').value=gap;$('gap_value').textContent=gap.toFixed(0)+' mm';display.render();}
$('pose').onchange=()=>{values={...poses[$('pose').value]};render();};$('lift').oninput=()=>{values.lift=+$('lift').value;render();};$('gap').oninput=()=>{values.left_gripper_open=values.right_gripper_open=Math.asin(+$('gap').value/140);render();};render();window.reference={...model,values};
</script></html>
